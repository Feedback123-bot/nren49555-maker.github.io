<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Encuesta de Satisfacción</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 15px;
      background: #f5f5f5;
    }

    h2 {
      text-align: center;
      color: #222;
      margin-bottom: 25px;
      font-size: 22px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      color: #333;
      font-size: 15px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      background: #0056b3;
    }

    /* 星星评分样式（手机/电脑都完美） */
    .rating {
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 5px;
    }

    .rating input {
      display: none;
    }

    .rating label {
      font-size: 32px;
      color: #ddd;
      cursor: pointer;
      transition: 0.2s;
      margin:0;
    }

    .rating input:checked ~ label,
    .rating label:hover,
    .rating label:hover ~ label {
      color: #ffc107;
    }
  </style>
</head>

<body>
  <h2>Encuesta de Satisfacción de Viaje</h2>
  <form id="surveyForm">

    <label>Grupo:</label>
    <input type="text" name="groupCode" placeholder="Código del grupo" required>

    <label>Nombre:</label>
    <input type="text" name="name" placeholder="Nombre completo" required>

    <label>Ciudad:</label>
    <input type="text" name="ciudades" placeholder="Ciudad" required>

    <label>Itinerario:</label>
    <input type="text" name="itinerario" placeholder="Itinerario" required>

    <label>Puntos Escénicos:</label>
    <input type="text" name="puntosEscenicos" placeholder="Puntos visitados">

    <!-- Hotel -->
    <label>Hotel - Desayuno</label>
    <div class="rating">
      <input type="radio" name="hotelDesayuno" id="hd5" value="5"><label for="hd5">★</label>
      <input type="radio" name="hotelDesayuno" id="hd4" value="4"><label for="hd4">★</label>
      <input type="radio" name="hotelDesayuno" id="hd3" value="3"><label for="hd3">★</label>
      <input type="radio" name="hotelDesayuno" id="hd2" value="2"><label for="hd2">★</label>
      <input type="radio" name="hotelDesayuno" id="hd1" value="1"><label for="hd1">★</label>
    </div>

    <label>Hotel - Instalaciones</label>
    <div class="rating">
      <input type="radio" name="hotelInstalacion" id="hi5" value="5"><label for="hi5">★</label>
      <input type="radio" name="hotelInstalacion" id="hi4" value="4"><label for="hi4">★</label>
      <input type="radio" name="hotelInstalacion" id="hi3" value="3"><label for="hi3">★</label>
      <input type="radio" name="hotelInstalacion" id="hi2" value="2"><label for="hi2">★</label>
      <input type="radio" name="hotelInstalacion" id="hi1" value="1"><label for="hi1">★</label>
    </div>

    <label>Hotel - Servicio</label>
    <div class="rating">
      <input type="radio" name="hotelServicio" id="hs5" value="5"><label for="hs5">★</label>
      <input type="radio" name="hotelServicio" id="hs4" value="4"><label for="hs4">★</label>
      <input type="radio" name="hotelServicio" id="hs3" value="3"><label for="hs3">★</label>
      <input type="radio" name="hotelServicio" id="hs2" value="2"><label for="hs2">★</label>
      <input type="radio" name="hotelServicio" id="hs1" value="1"><label for="hs1">★</label>
    </div>

    <!-- Restaurante -->
    <label>Restaurante - Calidad</label>
    <div class="rating">
      <input type="radio" name="restCalidad" id="rc5" value="5"><label for="rc5">★</label>
      <input type="radio" name="restCalidad" id="rc4" value="4"><label for="rc4">★</label>
      <input type="radio" name="restCalidad" id="rc3" value="3"><label for="rc3">★</label>
      <input type="radio" name="restCalidad" id="rc2" value="2"><label for="rc2">★</label>
      <input type="radio" name="restCalidad" id="rc1" value="1"><label for="rc1">★</label>
    </div>

    <label>Restaurante - Servicio</label>
    <div class="rating">
      <input type="radio" name="restServicio" id="rs5" value="5"><label for="rs5">★</label>
      <input type="radio" name="restServicio" id="rs4" value="4"><label for="rs4">★</label>
      <input type="radio" name="restServicio" id="rs3" value="3"><label for="rs3">★</label>
      <input type="radio" name="restServicio" id="rs2" value="2"><label for="rs2">★</label>
      <input type="radio" name="restServicio" id="rs1" value="1"><label for="rs1">★</label>
    </div>

    <label>Restaurante - Ambiente</label>
    <div class="rating">
      <input type="radio" name="restAmbiente" id="ra5" value="5"><label for="ra5">★</label>
      <input type="radio" name="restAmbiente" id="ra4" value="4"><label for="ra4">★</label>
      <input type="radio" name="restAmbiente" id="ra3" value="3"><label for="ra3">★</label>
      <input type="radio" name="restAmbiente" id="ra2" value="2"><label for="ra2">★</label>
      <input type="radio" name="restAmbiente" id="ra1" value="1"><label for="ra1">★</label>
    </div>

    <!-- Guía -->
    <label>Guía - Actitud</label>
    <div class="rating">
      <input type="radio" name="guiaActitud" id="ga5" value="5"><label for="ga5">★</label>
      <input type="radio" name="guiaActitud" id="ga4" value="4"><label for="ga4">★</label>
      <input type="radio" name="guiaActitud" id="ga3" value="3"><label for="ga3">★</label>
      <input type="radio" name="guiaActitud" id="ga2" value="2"><label for="ga2">★</label>
      <input type="radio" name="guiaActitud" id="ga1" value="1"><label for="ga1">★</label>
    </div>

    <label>Guía - Conocimiento</label>
    <div class="rating">
      <input type="radio" name="guiaConocimiento" id="gc5" value="5"><label for="gc5">★</label>
      <input type="radio" name="guiaConocimiento" id="gc4" value="4"><label for="gc4">★</label>
      <input type="radio" name="guiaConocimiento" id="gc3" value="3"><label for="gc3">★</label>
      <input type="radio" name="guiaConocimiento" id="gc2" value="2"><label for="gc2">★</label>
      <input type="radio" name="guiaConocimiento" id="gc1" value="1"><label for="gc1">★</label>
    </div>

    <label>Guía - Idioma</label>
    <div class="rating">
      <input type="radio" name="guiaIdioma" id="gi5" value="5"><label for="gi5">★</label>
      <input type="radio" name="guiaIdioma" id="gi4" value="4"><label for="gi4">★</label>
      <input type="radio" name="guiaIdioma" id="gi3" value="3"><label for="gi3">★</label>
      <input type="radio" name="guiaIdioma" id="gi2" value="2"><label for="gi2">★</label>
      <input type="radio" name="guiaIdioma" id="gi1" value="1"><label for="gi1">★</label>
    </div>

    <!-- Conductor -->
    <label>Conductor - Actitud</label>
    <div class="rating">
      <input type="radio" name="conductorActitud" id="ca5" value="5"><label for="ca5">★</label>
      <input type="radio" name="conductorActitud" id="ca4" value="4"><label for="ca4">★</label>
      <input type="radio" name="conductorActitud" id="ca3" value="3"><label for="ca3">★</label>
      <input type="radio" name="conductorActitud" id="ca2" value="2"><label for="ca2">★</label>
      <input type="radio" name="conductorActitud" id="ca1" value="1"><label for="ca1">★</label>
    </div>

    <label>Conductor - Manejo</label>
    <div class="rating">
      <input type="radio" name="manejo" id="m5" value="5"><label for="m5">★</label>
      <input type="radio" name="manejo" id="m4" value="4"><label for="m4">★</label>
      <input type="radio" name="manejo" id="m3" value="3"><label for="m3">★</label>
      <input type="radio" name="manejo" id="m2" value="2"><label for="m2">★</label>
      <input type="radio" name="manejo" id="m1" value="1"><label for="m1">★</label>
    </div>

    <label>Satisfacción General</label>
    <div class="rating">
      <input type="radio" name="satisfaccionGeneral" id="sg5" value="5"><label for="sg5">★</label>
      <input type="radio" name="satisfaccionGeneral" id="sg4" value="4"><label for="sg4">★</label>
      <input type="radio" name="satisfaccionGeneral" id="sg3" value="3"><label for="sg3">★</label>
      <input type="radio" name="satisfaccionGeneral" id="sg2" value="2"><label for="sg2">★</label>
      <input type="radio" name="satisfaccionGeneral" id="sg1" value="1"><label for="sg1">★</label>
    </div>

    <label>Comentarios</label>
    <textarea name="comentarios" placeholder="Escribe tus comentarios aquí..."></textarea>

    <button type="submit">Enviar Encuesta</button>
  </form>

  <script>
    const form = document.getElementById('surveyForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());

      try {
        await fetch("https://script.google.com/macros/s/AKfycbzsas2HkpF4G9IGP5y2biOwqfW4Quf5l0_Hh2U5d4D4SHr4aEW5prZJVN_trOqqtqOT/exec", {
          method: "POST",
          mode: 'cors',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(data)
        });

        alert("¡Encuesta enviada con éxito!");
        form.reset();
      } catch (err) {
        alert("Error al enviar: " + err.message);
      }
    });
  </script>
</body>
</html>
