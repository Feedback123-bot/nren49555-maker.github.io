<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta de Satisfacción</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 15px;
      background: #f5f5f5;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 22px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    /* 星星评分 */
    .rating {
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-end;
      gap: 5px;
    }

    .rating input {
      display: none;
    }

    .rating label {
      font-size: 28px;
      color: #ddd;
      cursor: pointer;
    }

    .rating input:checked ~ label,
    .rating label:hover,
    .rating label:hover ~ label {
      color: gold;
    }
  </style>
</head>

<body>

<h2>Encuesta de Satisfacción</h2>

<form id="surveyForm">

  <label>Grupo</label>
  <input name="groupCode" required>

  <label>Nombre</label>
  <input name="name" required>

  <label>Ciudad</label>
  <input name="ciudades" required>

  <label>Itinerario</label>
  <input name="itinerario" required>

  <label>Puntos Escénicos</label>
  <input name="puntosEscenicos">

  <label>Hotel - Desayuno</label>
  <div class="rating">
    <input type="radio" name="hotelDesayuno" value="5" id="hd5"><label for="hd5">★</label>
    <input type="radio" name="hotelDesayuno" value="4" id="hd4"><label for="hd4">★</label>
    <input type="radio" name="hotelDesayuno" value="3" id="hd3"><label for="hd3">★</label>
    <input type="radio" name="hotelDesayuno" value="2" id="hd2"><label for="hd2">★</label>
    <input type="radio" name="hotelDesayuno" value="1" id="hd1"><label for="hd1">★</label>
  </div>

  <label>Hotel - Instalaciones</label>
  <div class="rating">
    <input type="radio" name="hotelInstalacion" value="5" id="hi5"><label for="hi5">★</label>
    <input type="radio" name="hotelInstalacion" value="4" id="hi4"><label for="hi4">★</label>
    <input type="radio" name="hotelInstalacion" value="3" id="hi3"><label for="hi3">★</label>
    <input type="radio" name="hotelInstalacion" value="2" id="hi2"><label for="hi2">★</label>
    <input type="radio" name="hotelInstalacion" value="1" id="hi1"><label for="hi1">★</label>
  </div>

  <label>Hotel - Servicio</label>
  <div class="rating">
    <input type="radio" name="hotelServicio" value="5" id="hs5"><label for="hs5">★</label>
    <input type="radio" name="hotelServicio" value="4" id="hs4"><label for="hs4">★</label>
    <input type="radio" name="hotelServicio" value="3" id="hs3"><label for="hs3">★</label>
    <input type="radio" name="hotelServicio" value="2" id="hs2"><label for="hs2">★</label>
    <input type="radio" name="hotelServicio" value="1" id="hs1"><label for="hs1">★</label>
  </div>

  <label>Restaurante - Calidad</label>
  <div class="rating">
    <input type="radio" name="restCalidad" value="5" id="rc5"><label for="rc5">★</label>
    <input type="radio" name="restCalidad" value="4" id="rc4"><label for="rc4">★</label>
    <input type="radio" name="restCalidad" value="3" id="rc3"><label for="rc3">★</label>
    <input type="radio" name="restCalidad" value="2" id="rc2"><label for="rc2">★</label>
    <input type="radio" name="restCalidad" value="1" id="rc1"><label for="rc1">★</label>
  </div>

  <label>Restaurante - Servicio</label>
  <div class="rating">
    <input type="radio" name="restServicio" value="5" id="rs5"><label for="rs5">★</label>
    <input type="radio" name="restServicio" value="4" id="rs4"><label for="rs4">★</label>
    <input type="radio" name="restServicio" value="3" id="rs3"><label for="rs3">★</label>
    <input type="radio" name="restServicio" value="2" id="rs2"><label for="rs2">★</label>
    <input type="radio" name="restServicio" value="1" id="rs1"><label for="rs1">★</label>
  </div>

  <label>Guía - Actitud</label>
  <div class="rating">
    <input type="radio" name="guiaActitud" value="5" id="ga5"><label for="ga5">★</label>
    <input type="radio" name="guiaActitud" value="4" id="ga4"><label for="ga4">★</label>
    <input type="radio" name="guiaActitud" value="3" id="ga3"><label for="ga3">★</label>
    <input type="radio" name="guiaActitud" value="2" id="ga2"><label for="ga2">★</label>
    <input type="radio" name="guiaActitud" value="1" id="ga1"><label for="ga1">★</label>
  </div>

  <label>Satisfacción General</label>
  <div class="rating">
    <input type="radio" name="satisfaccionGeneral" value="5" id="sg5"><label for="sg5">★</label>
    <input type="radio" name="satisfaccionGeneral" value="4" id="sg4"><label for="sg4">★</label>
    <input type="radio" name="satisfaccionGeneral" value="3" id="sg3"><label for="sg3">★</label>
    <input type="radio" name="satisfaccionGeneral" value="2" id="sg2"><label for="sg2">★</label>
    <input type="radio" name="satisfaccionGeneral" value="1" id="sg1"><label for="sg1">★</label>
  </div>

  <label>Comentarios</label>
  <textarea name="comentarios"></textarea>

  <button type="submit">Enviar Encuesta</button>

</form>

<script>
const form = document.getElementById("surveyForm");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const btn = form.querySelector("button");
  btn.disabled = true;
  btn.innerText = "Enviando...";

  const data = Object.fromEntries(new FormData(form).entries());

  try {
    const res = await fetch("https://script.google.com/macros/s/AKfycbzsas2HkpF4G9IGP5y2biOwqfW4Quf5l0_Hh2U5d4D4SHr4aEW5prZJVN_trOqqtqOT/exec", {
      method: "POST",
      body: JSON.stringify(data)
    });

    const text = await res.text();

    if (res.ok && text.trim() === "ok") {
      alert("✅ Encuesta enviada con éxito");
      form.reset();
    } else {
      alert("⚠️ Error al enviar");
    }

  } catch (err) {
    alert("❌ Error de red: " + err.message);
  }

  btn.disabled = false;
  btn.innerText = "Enviar Encuesta";
});
</script>

</body>
</html>
