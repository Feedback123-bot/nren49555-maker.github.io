<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta de Satisfacción de Viaje</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
    h2 { text-align: center; color: #333; }
    label { font-weight: bold; display: block; margin-top: 15px; }
    input, textarea, button { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc; }
    textarea { resize: vertical; height: 80px; }
    button { background-color: #4285F4; color: white; border: none; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #3367D6; }
    .rating { display: flex; flex-direction: row-reverse; justify-content: flex-start; margin-top: 5px; }
    .rating input { display: none; }
    .rating label { font-size: 25px; color: #ccc; cursor: pointer; margin-right: 5px; }
    .rating input:checked ~ label, .rating label:hover, .rating label:hover ~ label { color: #FFD700; }
  </style>
</head>
<body>
  <h2>Encuesta de Satisfacción de Viaje</h2>
  <form id="surveyForm">

    <label>Grupo:</label>
    <input type="text" name="groupCode" placeholder="Código del grupo" required>

    <label>Nombre:</label>
    <input type="text" name="name" placeholder="Nombre completo" required>

    <label>Ciudad:</label>
    <input type="text" name="ciudades" placeholder="Ciudad" required>

    <label>Itinerario:</label>
    <input type="text" name="itinerario" placeholder="Itinerario" required>

    <label>Puntos Escénicos:</label>
    <input type="text" name="puntosEscenicos" placeholder="Puntos visitados">

    <!-- Hotel -->
    <label>Hotel - Desayuno</label>
    <div class="rating">
      <input type="radio" name="hotelDesayuno" value="5"><label>★</label>
      <input type="radio" name="hotelDesayuno" value="4"><label>★</label>
      <input type="radio" name="hotelDesayuno" value="3"><label>★</label>
      <input type="radio" name="hotelDesayuno" value="2"><label>★</label>
      <input type="radio" name="hotelDesayuno" value="1" checked><label>★</label>
    </div>

    <label>Hotel - Instalaciones</label>
    <div class="rating">
      <input type="radio" name="hotelInstalacion" value="5"><label>★</label>
      <input type="radio" name="hotelInstalacion" value="4"><label>★</label>
      <input type="radio" name="hotelInstalacion" value="3"><label>★</label>
      <input type="radio" name="hotelInstalacion" value="2"><label>★</label>
      <input type="radio" name="hotelInstalacion" value="1" checked><label>★</label>
    </div>

    <label>Hotel - Servicio</label>
    <div class="rating">
      <input type="radio" name="hotelServicio" value="5"><label>★</label>
      <input type="radio" name="hotelServicio" value="4"><label>★</label>
      <input type="radio" name="hotelServicio" value="3"><label>★</label>
      <input type="radio" name="hotelServicio" value="2"><label>★</label>
      <input type="radio" name="hotelServicio" value="1" checked><label>★</label>
    </div>

    <!-- Restaurante -->
    <label>Restaurante - Calidad</label>
    <div class="rating">
      <input type="radio" name="restCalidad" value="5"><label>★</label>
      <input type="radio" name="restCalidad" value="4"><label>★</label>
      <input type="radio" name="restCalidad" value="3"><label>★</label>
      <input type="radio" name="restCalidad" value="2"><label>★</label>
      <input type="radio" name="restCalidad" value="1" checked><label>★</label>
    </div>

    <label>Restaurante - Servicio</label>
    <div class="rating">
      <input type="radio" name="restServicio" value="5"><label>★</label>
      <input type="radio" name="restServicio" value="4"><label>★</label>
      <input type="radio" name="restServicio" value="3"><label>★</label>
      <input type="radio" name="restServicio" value="2"><label>★</label>
      <input type="radio" name="restServicio" value="1" checked><label>★</label>
    </div>

    <label>Restaurante - Ambiente</label>
    <div class="rating">
      <input type="radio" name="restAmbiente" value="5"><label>★</label>
      <input type="radio" name="restAmbiente" value="4"><label>★</label>
      <input type="radio" name="restAmbiente" value="3"><label>★</label>
      <input type="radio" name="restAmbiente" value="2"><label>★</label>
      <input type="radio" name="restAmbiente" value="1" checked><label>★</label>
    </div>

    <!-- Guía -->
    <label>Guía - Actitud</label>
    <div class="rating">
      <input type="radio" name="guiaActitud" value="5"><label>★</label>
      <input type="radio" name="guiaActitud" value="4"><label>★</label>
      <input type="radio" name="guiaActitud" value="3"><label>★</label>
      <input type="radio" name="guiaActitud" value="2"><label>★</label>
      <input type="radio" name="guiaActitud" value="1" checked><label>★</label>
    </div>

    <label>Guía - Conocimiento</label>
    <div class="rating">
      <input type="radio" name="guiaConocimiento" value="5"><label>★</label>
      <input type="radio" name="guiaConocimiento" value="4"><label>★</label>
      <input type="radio" name="guiaConocimiento" value="3"><label>★</label>
      <input type="radio" name="guiaConocimiento" value="2"><label>★</label>
      <input type="radio" name="guiaConocimiento" value="1" checked><label>★</label>
    </div>

    <label>Guía - Idioma</label>
    <div class="rating">
      <input type="radio" name="guiaIdioma" value="5"><label>★</label>
      <input type="radio" name="guiaIdioma" value="4"><label>★</label>
      <input type="radio" name="guiaIdioma" value="3"><label>★</label>
      <input type="radio" name="guiaIdioma" value="2"><label>★</label>
      <input type="radio" name="guiaIdioma" value="1" checked><label>★</label>
    </div>

    <!-- Conductor -->
    <label>Conductor - Actitud</label>
    <div class="rating">
      <input type="radio" name="conductorActitud" value="5"><label>★</label>
      <input type="radio" name="conductorActitud" value="4"><label>★</label>
      <input type="radio" name="conductorActitud" value="3"><label>★</label>
      <input type="radio" name="conductorActitud" value="2"><label>★</label>
      <input type="radio" name="conductorActitud" value="1" checked><label>★</label>
    </div>

    <label>Conductor - Manejo</label>
    <div class="rating">
      <input type="radio" name="manejo" value="5"><label>★</label>
      <input type="radio" name="manejo" value="4"><label>★</label>
      <input type="radio" name="manejo" value="3"><label>★</label>
      <input type="radio" name="manejo" value="2"><label>★</label>
      <input type="radio" name="manejo" value="1" checked><label>★</label>
    </div>

    <label>Satisfacción General</label>
    <div class="rating">
      <input type="radio" name="satisfaccionGeneral" value="5"><label>★</label>
      <input type="radio" name="satisfaccionGeneral" value="4"><label>★</label>
      <input type="radio" name="satisfaccionGeneral" value="3"><label>★</label>
      <input type="radio" name="satisfaccionGeneral" value="2"><label>★</label>
      <input type="radio" name="satisfaccionGeneral" value="1" checked><label>★</label>
    </div>

    <label>Comentarios</label>
    <textarea name="comentarios" placeholder="Escribe tus comentarios aquí..."></textarea>

    <button type="button" onclick="submitSurvey()">Enviar Encuesta</button>

  </form>

  <script>
    function submitSurvey() {
      const form = document.getElementById('surveyForm');
      const data = Object.fromEntries(new FormData(form).entries());

      fetch("https://script.google.com/macros/s/AKfycbzsas2HkpF4G9IGP5y2biOwqfW4Quf5l0_Hh2U5d4D4SHr4aEW5prZJVN_trOqqtqOT/exec", {
        method: "POST",
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(res => res.text())
      .then(msg => {
        alert("¡Encuesta enviada con éxito!");
        form.reset();
      })
      .catch(err => alert("Error al enviar la encuesta: " + err));
    }
  </script>
</body>
</html>
